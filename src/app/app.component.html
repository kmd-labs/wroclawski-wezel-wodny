@let t = i18n.t();

<main class="viewport">
  <app-splash (revealed)="splash.finish()"></app-splash>

  <!-- Top HUD: Left Logotype + Language, Right View Switcher -->
  <header class="header" [class.header--popup-open]="isPopupOpen()">
    <div class="header__left">
      <app-brand
        [appName]="'Wrocławski Węzeł Wodny'"
        [lang]="i18n.lang()"
        (btnClick)="about.open({ lang: i18n.lang() })">
      </app-brand>

      <div class="header__settings glass-panel" role="group" [attr.aria-label]="t.changeLanguage">
        <app-dropdown
          variant="ghost"
          [size]="bp.mobileLandscape() ? 'sm' : 'md'"
          [icon]="bp.mobile() ? null : globeIcon"
          [options]="langOptions()"
          [value]="i18n.lang()"
          [ariaLabel]="t.changeLanguage"
          (valueChange)="i18n.setLang($event)">
        </app-dropdown>
      </div>
    </div>

    <div class="header__right">
      <div class="header__view glass-panel">
        <app-dropdown
          variant="ghost"
          [size]="bp.mobileLandscape() ? 'sm' : 'md'"
          align="right"
          [fullWidth]="true"
          [options]="viewOptions()"
          [value]="state.currentView()"
          [icon]="currentViewIcon()"
          [ariaLabel]="t.chooseView"
          (valueChange)="state.setView($event)">
        </app-dropdown>
      </div>
    </div>
  </header>

  <!-- Fullscreen 3D Map Stage -->
  <section class="stage" [attr.aria-label]="t.stageAriaLabel">
    <app-map-stage></app-map-stage>
  </section>

  <!-- Pin Inspector Card -->
  <app-pin-inspector></app-pin-inspector>

  <!-- Bottom Dock: Controls, Telemetry, Timeline & Popups -->
  <app-map-dock></app-map-dock>

  <app-popup [closeAriaLabel]="t.close"></app-popup>
  <app-tooltip></app-tooltip>
</main>
